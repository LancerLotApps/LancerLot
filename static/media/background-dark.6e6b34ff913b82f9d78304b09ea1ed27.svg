<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <!-- Evolve 2048 - Main Menu background, dark mode. 1080x1920 (portrait, matches the promo
       video's vertical cuts). Derived from ui/ClassyStyle.kt's classyCanvasBrush() (the corner-
       to-corner gradient backdrop) layered under ui/ThemedBackground.kt's faint 45-degree grid +
       floating rounded tiles, using DarkClassyPalette's canvas colors and GoldPrimaryDark/
       GoldSecondaryDark for the grid/tile tint. -->
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2620"/>
      <stop offset="50%" stop-color="#1E1B17"/>
      <stop offset="100%" stop-color="#15130F"/>
    </linearGradient>
    <pattern id="grid" width="180" height="180" patternUnits="userSpaceOnUse">
      <path d="M0,0 L180,180 M180,0 L0,180" stroke="#D9B45C" stroke-opacity="0.06" stroke-width="1.5" fill="none"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#canvas)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>

  <g fill="#D9B45C" fill-opacity="0.1">
    <rect x="216" y="422.4" width="162" height="162" rx="25.92" transform="rotate(15 297 503.4)"/>
    <rect x="734.4" y="192" width="108" height="108" rx="17.28" transform="rotate(-20 788.4 246)"/>
    <rect x="453.6" y="940.8" width="237.6" height="237.6" rx="38.02" transform="rotate(45 572.4 1059.6)"/>
    <rect x="939.6" y="1190.4" width="129.6" height="129.6" rx="20.74" transform="rotate(-10 1004.4 1255.2)"/>
    <rect x="162" y="1440" width="205.2" height="205.2" rx="32.83" transform="rotate(30 264.6 1542.6)"/>
    <rect x="594" y="1632" width="118.8" height="118.8" rx="19.01" transform="rotate(-25 653.4 1691.4)"/>
  </g>

  <g fill="#F0D8A0" fill-opacity="0.08">
    <rect x="540" y="288" width="183.6" height="183.6" rx="29.38" transform="rotate(-15 631.8 379.8)"/>
    <rect x="896.4" y="710.4" width="216" height="216" rx="34.56" transform="rotate(25 1004.4 818.4)"/>
    <rect x="151.2" y="1017.6" width="118.8" height="118.8" rx="19.01" transform="rotate(-35 210.6 1077)"/>
    <rect x="378" y="1344" width="151.2" height="151.2" rx="24.19" transform="rotate(10 453.6 1419.6)"/>
    <rect x="972" y="1632" width="172.8" height="172.8" rx="27.65" transform="rotate(40 1058.4 1718.4)"/>
  </g>
</svg>
